<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile</title>
</head>

<body>
    <h1 id="sortie">a</h1>

    <script>
        const utilisateur = { nom: "Voisin Clément", age: 12, ville: "Paris" }
        class Profil {
            constructor(user) {
                this.user = user
            }
        }
        const profil = new Profil(utilisateur)
        const { nom, age, ville } = profil.user
        document.querySelector("#sortie").textContent = nom
    </script>
</body>

</html>
