services:
  db:
    image: mongo:latest
    environment:
      MONGO_INITDB_DATABASE: tw3_tasks
    volumes:
      - mongodata:/data/db
    ports:
      - "27017:27017"

  api:
    build: .
    depends_on:
      - db
    environment:
      PORT: "3000"
      MONGODB_URI: "mongodb://db:27017"
      MONGODB_DB: "tw3_tasks"
    ports:
      - "3000:3000"

volumes:
  mongodata: